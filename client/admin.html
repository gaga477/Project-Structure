<!DOCTYPE html>
<html>
<head>
  <title>Zunny Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f6f9;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      float: right;
    }
  </style>
</head>

<body>

<h1>📊 Zunny Mini Mart Dashboard</h1>
<button onclick="logout()">Logout</button>

<div class="card">
  <h3>Total Revenue</h3>
  <h2 id="revenue">₦0</h2>
</div>

<div class="card">
  <h3>Total Profit</h3>
  <h2 id="profit">₦0</h2>
</div>

<div class="card">
  <input type="date" id="start">
  <input type="date" id="end">
  <button onclick="loadReport()">Filter</button>
</div>

<div class="card">
  <canvas id="salesChart"></canvas>
</div>

<div class="card">
  <h3>Recent Sales</h3>
  <div id="salesInfo" style="margin-bottom:12px;color:#555">Loading recent sales...</div>
  <ul id="salesList"></ul>
</div>

<script>
const token = localStorage.getItem("token");

// Auth guard
if (!token || localStorage.getItem("role") !== "admin") {
  window.location.href = "login.html";
}

// 📊 Load Report
async function loadReport() {
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;

  let url = "/api/sales/report";
  if (start && end) url += `?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;

  try {
    const res = await fetch(url, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      const errorData = await res.json().catch(() => ({}));
      throw new Error(errorData.message || `Unable to load report (${res.status})`);
    }

    const data = await res.json();
    const labels = data.map(d => `${d._id.day}/${d._id.month}`);
    const totals = data.map(d => d.totalSales);

    const totalRevenue = totals.reduce((a, b) => a + b, 0);
    document.getElementById("revenue").textContent = "₦" + totalRevenue.toLocaleString();

    const profits = data.map(d => d.totalProfit);
    const totalProfit = profits.reduce((a, b) => a + b, 0);
    document.getElementById("profit").textContent = "₦" + totalProfit;

    new Chart(document.getElementById("salesChart"), {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Daily Sales (₦)",
          data: totals,
          borderColor: "#16a34a",
          backgroundColor: "rgba(22,163,74,0.1)",
          tension: 0.3,
          fill: true
        }]
      }
    });
  } catch (err) {
    console.error(err);
    document.getElementById("revenue").textContent = "₦0";
    document.getElementById("profit").textContent = "₦0";
    document.getElementById("salesChart").getContext("2d").clearRect(0, 0, document.getElementById("salesChart").width, document.getElementById("salesChart").height);
  }
}

// 🧾 Load Sales History
async function loadSales() {
  const list = document.getElementById("salesList");
  const info = document.getElementById("salesInfo");
  list.innerHTML = "";
  info.textContent = "Loading recent sales...";

  try {
    const res = await fetch("/api/sales", {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      const errorData = await res.json().catch(() => ({}));
      info.textContent = `Error loading recent sales: ${errorData.message || res.statusText}`;
      return;
    }

    const sales = await res.json();
    if (!Array.isArray(sales) || sales.length === 0) {
      info.textContent = "No sales found yet.";
      return;
    }

    info.textContent = `Showing ${Math.min(10, sales.length)} of ${sales.length} total sales`;
    sales.slice(0, 10).forEach(s => {
      const li = document.createElement("li");
      li.textContent = `₦${s.total} | Profit: ₦${s.profit} | ${new Date(s.date).toLocaleString()}`;
      list.appendChild(li);
    });
  } catch (err) {
    console.error(err);
    info.textContent = `Sales load error: ${err.message || "Unknown error"}`;
  }
}

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  window.location.href = "login.html";
}

loadReport();
loadSales();
</script>

</body>
</html>
